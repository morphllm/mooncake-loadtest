name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fio
      - run: python -m pip install numpy
      - run: bash -n mooncake-loadtest.sh && shellcheck -S error mooncake-loadtest.sh
      - run: python -m unittest discover -s tests -v
